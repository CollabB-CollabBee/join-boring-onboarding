name: Task
description: A structured task for development work
title: "[Task] <short summary>"
labels: ["task"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      placeholder: Describe the task
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      placeholder: Requirements, constraints, dependencies…
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      placeholder: "Given...\nWhen...\nThen..."
    validations:
      required: false

  - type: input
    id: related
    attributes:
      label: Related Issues / PRs
      placeholder: "#123"
